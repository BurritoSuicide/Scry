[package]
name = "charon"
version = "0.1.0"
edition = "2021"
description = "Charon — a modular TUI for OSINT investigations across emails, IPs, JA4 fingerprints, and hashes"
license = "MIT"
authors = ["Charon Contributors"]
readme = "README.md"
keywords = ["osint", "tui", "virustotal", "investigation", "security"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
crossterm = "0.28"
csv = "1"
dirs = "6"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
